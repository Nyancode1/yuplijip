name: Publish Android update
on:
  push:
    branches: [main]
    paths: ['release/yuplijip.apk', '.github/workflows/release-apk.yml']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: publish-android-update
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Nyancode1/yuplijip' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signed APK and publish a new release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=release/yuplijip.apk
          test -f "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager 'build-tools;35.0.0'; fi
          signer=$("$tools/apksigner" verify --print-certs "$apk") || { echo "::error::APK signature verification failed"; exit 1; }
          grep -Fxq 'Signer #1 certificate SHA-256 digest: 286293f24da8043bf474cac001344509fdb3fee9f3c5e47a9da9346e9f226095' <<< "$signer" || { echo "::error::Unexpected signing certificate"; exit 1; }
          test "$(unzip -p "$apk" assets/update-repository.txt)" = "$GITHUB_REPOSITORY" || { echo "::error::Unexpected update repository"; exit 1; }
          unzip -p "$apk" assets/release_credits.json > "$RUNNER_TEMP/packaged-credits.json"
          jq -e --slurp 'length == 2 and .[0] == .[1]' data/release_credits.json "$RUNNER_TEMP/packaged-credits.json" > /dev/null
          diff -q --strip-trailing-cr src/matching.js <(unzip -p "$apk" assets/lib/matching.js)
          for asset in app.js worker.js; do
            diff -q --strip-trailing-cr "mobile/ui/$asset" <(unzip -p "$apk" "assets/$asset")
          done
          info=$("$tools/aapt" dump badging "$apk")
          pattern="^package: name='app[.]songbook[.]tj' versionCode='([1-9][0-9]*)' versionName='([0-9]+([.][0-9]+){1,3})'"
          [[ "$info" =~ $pattern ]] || { echo "::error::Unexpected manifest package or version"; exit 1; }
          code=${BASH_REMATCH[1]}
          tag="v${BASH_REMATCH[2]}-$code"
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          highest=$(jq '[.[][] | select(.draft == false and .prerelease == false) | .tag_name | capture("^v[0-9]+(?:[.][0-9]+){1,3}-(?<code>[1-9][0-9]*)$").code | tonumber] | max // 0' <<< "$releases")
          if (( code == highest )); then
            # A re-run is successful only if the published asset is byte-identical.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern yuplijip.apk --dir "$RUNNER_TEMP/published"
            cmp "$apk" "$RUNNER_TEMP/published/yuplijip.apk"
            exit 0
          fi
          (( code > highest ))
          gh release create "$tag" "$apk#유플리집.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "유플리집 ${tag%-*}" --notes "Android 앱에서 업데이트할 수 있습니다."
